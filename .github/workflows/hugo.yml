# Build and deploy the Hugo site to GitHub Pages.
# Based on GitHub's official starter (actions/starter-workflows, pages/hugo.yml), with:
#   - Hugo pinned to the newest version the Blowfish theme supports (see HANDOVER.md)
#   - no Dart Sass or npm steps: Blowfish ships compiled CSS and the site has no package.json
#   - a warning for any content file over 5 MB
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is running.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Flag files over 5 MB
        run: |
          find content static assets -type f -size +5M -print0 | while IFS= read -r -d '' f; do
            echo "::warning file=$f::$(du -h "$f" | cut -f1) - keep committed files under ~5 MB"
          done
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/London
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

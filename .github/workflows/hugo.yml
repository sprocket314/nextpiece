# Build and deploy the Hugo site to GitHub Pages.
# Based on GitHub's official starter (actions/starter-workflows, pages/hugo.yml), with:
#   - Hugo pinned to the newest version the Blowfish theme supports (see HANDOVER.md)
#   - no Dart Sass or npm steps: Blowfish ships compiled CSS and the site has no package.json
#   - a warning for any content file over 5 MB
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is running.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Flag files over 5 MB
        run: |
          find . \( -path ./.git -o -path ./themes \) -prune -o -type f -size +5M -print0 | while IFS= read -r -d '' f; do
            echo "::warning file=$f::$(du -h "$f" | cut -f1) - keep committed files under ~5 MB"
          done
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/London
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Keep the post list for the Instagram step
        uses: actions/upload-artifact@v7
        with:
          name: instagram-feed
          path: public/instagram.json
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # After the site is live, post any new blog posts to Instagram (tools/instagram_post.py).
  # Without the IG_ACCESS_TOKEN secret it only logs what it would post.
  instagram:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write   # to record what was posted in data/instagram_posted.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get the post list from the build
        uses: actions/download-artifact@v8
        with:
          name: instagram-feed
          path: ${{ runner.temp }}/feed
      - name: Post new blog posts to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 tools/instagram_post.py --feed "${{ runner.temp }}/feed/instagram.json"
      - name: Record what was posted
        if: always()
        run: |
          if git diff --quiet -- data/instagram_posted.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram_posted.json
          git commit -m "Record Instagram posts [skip ci]"
          git pull --rebase --quiet
          git push

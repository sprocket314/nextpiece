# Diagnose the Instagram token without revealing it: tries the Instagram and Facebook API hosts
# and reports which one accepts the token and which Instagram account it reaches.
# With the repo variable IG_USER_ID set, it also creates an unpublished media container for the
# newest published post's cover (skipped while there is none): proof that posting would work.
# Unpublished containers expire after 24 h.
# Run it by hand: Actions > "Check Instagram token" > Run workflow.
name: Check Instagram token

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the APIs (prints ids, names and error codes only)
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
          ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ -z "$T" ]; then echo "::error::IG_ACCESS_TOKEN is not set"; exit 1; fi
          show() { jq -c "if .error then {error: {code: .error.code, subcode: .error.error_subcode, type: .error.type, message: .error.message}} else ($1) end"; }
          probe() {  # label, url (token appended), jq filter for the useful part
            echo "== $1"
            curl -sS -G "$2" --data-urlencode "access_token=${T}" | show "$3"
          }
          probe "Instagram host: me" "https://graph.instagram.com/v27.0/me?fields=user_id,username,account_type" '.'
          probe "Facebook host: me" "https://graph.facebook.com/v27.0/me?fields=id,name" '.'
          probe "Facebook host: token permissions" "https://graph.facebook.com/v27.0/me/permissions" '[.data[]? | select(.status=="granted") | .permission]'
          if [ -n "$ID" ]; then
            probe "Facebook host: Instagram account ${ID}" "https://graph.facebook.com/v27.0/${ID}?fields=username,media_count" '.'
            probe "Publishing quota" "https://graph.facebook.com/v27.0/${ID}/content_publishing_limit?fields=quota_usage,config" '.'
            echo "== Create an unpublished media container (expires in 24 h, nothing is posted)"
            img=$(curl -sS https://nextpiece.co.uk/instagram.json | jq -r '.posts[0].image // empty')
            if [ -z "$img" ]; then
              echo "No published post with a cover yet: skipped"
            else
              curl -sS -X POST "https://graph.facebook.com/v27.0/${ID}/media" \
                --data-urlencode "image_url=${img}" --data-urlencode "caption=Setup test, not published" \
                --data-urlencode "access_token=${T}" | show '{container_created: .id}'
            fi
          fi
